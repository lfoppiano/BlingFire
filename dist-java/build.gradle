plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'com.github.lfoppiano'
version = '0.2.1'

repositories {
    mavenCentral()
}

java {
    withJavadocJar()
    withSourcesJar()
}

def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()

// Compile native libs using CMake
// Compile native libs using CMake
task cmake(type: Exec) {
    doFirst {
        file('../build').mkdirs()
    }
    workingDir file('../build')
    
    // Find JAVA_HOME
    def javaHome = System.getenv("JAVA_HOME")
    if (javaHome == null) {
         javaHome = System.getProperty("java.home")
         if (javaHome.endsWith("jre")) {
             javaHome = javaHome.substring(0, javaHome.length() - 4)
         }
    }
    
    commandLine 'cmake', '..', "-DJAVA_HOME=${javaHome}"
    standardOutput = System.out
}

task buildNative(type: Exec) {
    dependsOn cmake
    workingDir file('../build')
    commandLine 'make', 'blingfirejni'
    standardOutput = System.out
}

// copy native libs to resources
task copyNativeLibs(type: Copy) {
    dependsOn buildNative
    from('../build') {
        include 'libblingfirejni.so'
        include 'libblingfirejni.dylib'
        include 'blingfirejni.dll'
    }
    // Package into 'resources' so it goes into the JAR
    into 'src/main/resources' 
}

// Clean up resources before processing to avoid stale libs
// Clean up resources before processing to avoid stale libs
processResources.dependsOn copyNativeLibs

// Ensure sourcesJar depends on copyNativeLibs if it includes resources
sourcesJar.dependsOn copyNativeLibs

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'BlingFire Java'
                description = 'Java bindings for Microsoft BlingFire'
                url = 'https://github.com/lfoppiano/blingfire'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'lfoppiano'
                        name = 'Luca Foppiano'
                        email = 'luca@foppiano.org'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/lfoppiano/blingfire.git'
                    developerConnection = 'scm:git:ssh://github.com/lfoppiano/blingfire.git'
                    url = 'https://github.com/lfoppiano/blingfire'
                }
            }
        }
    }
}
