plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'com.github.lfoppiano'
version = '0.2.1'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withJavadocJar()
    withSourcesJar()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
    // Allow the native library to be found in the CMake build directory
    def buildDir = System.getenv('BLINGFIRE_BUILD_DIR') ?: '../build'
    systemProperty 'java.library.path', buildDir
}

def osName = System.getProperty("os.name").toLowerCase()
def osArch = System.getProperty("os.arch").toLowerCase()

// Determine OS and arch for native resource layout
def nativeOs = osName.contains('linux') ? 'linux' :
               osName.contains('mac') || osName.contains('darwin') ? 'darwin' :
               osName.contains('win') ? 'win' : 'unknown'

def nativeArch = osArch.contains('amd64') || osArch.contains('x86_64') ? 'x86_64' :
                 osArch.contains('aarch64') || osArch.contains('arm64') ? 'aarch64' : 'unknown'

// Copy native JNI lib from CMake build into the resource layout
task copyNativeLibs(type: Copy) {
    from('../build') {
        include 'libblingfirejni.so'
        include 'libblingfirejni.dylib'
        include 'blingfirejni.dll'
    }
    into "src/main/resources/native/${nativeOs}/${nativeArch}"
}

processResources.dependsOn copyNativeLibs
sourcesJar.dependsOn copyNativeLibs

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'BlingFire Java'
                description = 'Java bindings for BlingFire - a high-performance NLP tokenization library'
                url = 'https://github.com/lfoppiano/blingfire'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'lfoppiano'
                        name = 'Luca Foppiano'
                        email = 'luca@foppiano.org'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/lfoppiano/blingfire.git'
                    developerConnection = 'scm:git:ssh://github.com/lfoppiano/blingfire.git'
                    url = 'https://github.com/lfoppiano/blingfire'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'OSSRH'
            def releasesRepoUrl = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
            def snapshotsRepoUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username = System.getenv('OSSRH_USERNAME') ?: ''
                password = System.getenv('OSSRH_PASSWORD') ?: ''
            }
        }
    }
}

signing {
    required { gradle.taskGraph.hasTask('publish') }
    sign publishing.publications.mavenJava
}
